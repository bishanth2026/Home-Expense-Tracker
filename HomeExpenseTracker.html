<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOME Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#1B211D; --muted:#767C71;
  --primary:#1F5C4C; --primary-dark:#164135; --accent:#C08A2E; --warn:#C77D2E; --danger:#B8433A; --good:#1F5C4C;
  --divider:#DEDFD3; --divider-soft:#E9EAE3;
}
body.dark{
  --bg:#141815; --surface:#1D2320; --ink:#EDEEE7; --muted:#8D958A;
  --primary:#4E9C82; --primary-dark:#6BB89C; --accent:#D9A24F; --divider:#2C332E; --divider-soft:#262C28;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);background:var(--bg);}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;color:var(--muted);}
.spin{animation:spin 1.2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.shell{display:flex;min-height:100vh;}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--divider);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:18px;letter-spacing:.5px;padding:4px 8px 22px;color:var(--primary-dark);}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit;}
.navitem:hover{background:var(--divider-soft);color:var(--ink);}
.navitem.active{background:var(--primary);color:#fff;}
.sidebar-foot{font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--muted);padding:8px;opacity:.75;}
.main{flex:1;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 14px;flex-wrap:wrap;gap:10px;}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.title{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin:2px 0 0;}
.topbar-actions{display:flex;gap:8px;}
.content{padding:8px 32px 110px;max-width:1180px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent;border-color:var(--divider);color:var(--ink);}
.btn-ghost:hover{background:var(--divider-soft);}
.btn-secondary{background:var(--divider-soft);color:var(--ink);}
.btn-secondary:hover{background:var(--divider);}
.btn-danger{background:var(--danger);color:#fff;}
.fab{position:fixed;bottom:26px;right:30px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(31,92,76,.35);cursor:pointer;z-index:20;font-size:26px;line-height:1;}
.fab:hover{background:var(--primary-dark);}
.cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.stub{background:var(--surface);border:1px dashed var(--divider);border-radius:10px;padding:14px 16px;position:relative;}
.stub::before,.stub::after{content:"";position:absolute;width:12px;height:12px;background:var(--bg);border-radius:50%;top:50%;transform:translateY(-50%);}
.stub::before{left:-7px;}.stub::after{right:-7px;}
.stub-bad{border-color:var(--danger);}
.stub-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.stub-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.stub-value{font-size:21px;font-weight:600;}
.stub-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.pos{color:var(--good);} .neg{color:var(--danger);}
.streak{display:flex;align-items:center;gap:7px;background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;width:fit-content;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.panel{background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;}
.panel-head h3{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;margin:0;}
.panel-head p{font-size:11.5px;color:var(--muted);margin:2px 0 0;}
.link-btn{background:none;border:none;color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;}
.empty{color:var(--muted);font-size:13px;padding:18px 4px;text-align:center;}
.pie-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px;}
.legend-row{display:flex;align-items:center;gap:7px;font-size:12px;}
.legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend-val{color:var(--muted);font-size:11.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.toplist{display:flex;flex-direction:column;gap:2px;}
.toprow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--divider-soft);font-size:13px;}
.toprow:last-child{border-bottom:none;}
.topnum{width:16px;color:var(--muted);font-size:11px;font-weight:700;}
.topname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topval{font-weight:600;}
.chip{font-size:10px;background:var(--divider-soft);color:var(--muted);padding:2px 7px;border-radius:20px;font-weight:600;text-transform:capitalize;}
.chip-soft{margin-left:6px;}
.budgetlist{display:flex;flex-direction:column;gap:14px;}
.budgetrow{margin-bottom:2px;}
.budgetrow-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.pct-ok{color:var(--good);} .pct-warn{color:var(--warn);} .pct-over{color:var(--danger);}
.track{height:7px;background:var(--divider-soft);border-radius:6px;overflow:hidden;}
.fill{height:100%;border-radius:6px;}
.fill-ok{background:var(--primary);} .fill-warn{background:var(--warn);} .fill-over{background:var(--danger);}
.budgetrow-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--divider-soft);padding:4px;border-radius:9px;width:fit-content;flex-wrap:wrap;}
.tab{border:none;background:transparent;padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.range-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--divider);border-radius:8px;padding:7px 10px;flex:1;min-width:180px;color:var(--muted);}
.search input{border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);width:100%;font-family:inherit;}
.select{border:1px solid var(--divider);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:12.5px;color:var(--ink);font-family:inherit;}
.select-full{width:100%;}
.tx-total{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;padding:0 2px;}
.tx-total strong{color:var(--ink);font-size:15px;}
.week-groups{display:flex;flex-direction:column;gap:16px;}
.week-group-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;padding:0 2px;}
.week-group-head strong{color:var(--ink);}
.tx-table{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--divider);border-radius:10px;overflow:hidden;}
.tx-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--divider-soft);}
.tx-row:last-child{border-bottom:none;}
.tx-main{flex:1;min-width:0;}
.tx-cat{font-size:13px;font-weight:600;}
.tx-sub{font-weight:400;color:var(--muted);}
.tx-note{font-size:12px;color:var(--muted);margin-top:1px;}
.tx-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.tx-amount{font-weight:700;font-size:13.5px;white-space:nowrap;}
.tx-actions{display:flex;gap:2px;}
.tx-actions button{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;font-size:13px;}
.tx-actions button:hover{background:var(--divider-soft);color:var(--ink);}
.overlay{position:fixed;inset:0;background:rgba(20,24,21,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--surface);}
.modal-title{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
.modal-body{padding:16px 18px 20px;}
.iconbtn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:5px;border-radius:6px;font-size:14px;}
.iconbtn:hover{background:var(--divider-soft);color:var(--ink);}
.iconbtn:disabled{opacity:.35;cursor:default;}
.quickrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.quickchip{display:flex;align-items:center;gap:5px;border:1px solid var(--divider);background:var(--divider-soft);padding:6px 11px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;}
.quickchip:hover{border-color:var(--primary);color:var(--primary);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field-label{font-size:11.5px;font-weight:600;color:var(--muted);}
.field-label em{color:var(--danger);font-style:normal;margin-left:2px;}
.inp{border:1px solid var(--divider);background:var(--bg);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);font-family:inherit;width:100%;}
.inp:focus,.select:focus{outline:2px solid var(--primary);outline-offset:1px;}
.inp-sm{padding:6px 8px;font-size:12.5px;width:100px;flex-shrink:0;}
.inp-inline{flex:1;border:none;background:transparent;padding:4px 2px;}
.segmented{display:flex;border:1px solid var(--divider);border-radius:8px;overflow:hidden;width:fit-content;}
.segmented button{border:none;background:var(--bg);color:var(--muted);padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.segmented button.active{background:var(--primary);color:#fff;}
.recurring-row{display:flex;align-items:center;gap:12px;margin:4px 0 12px;flex-wrap:wrap;}
.checkbox{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;}
.note-inline{font-size:11px;color:var(--muted);background:var(--divider-soft);padding:8px 10px;border-radius:7px;margin-bottom:10px;}
.error{display:flex;align-items:center;gap:6px;color:var(--danger);font-size:12.5px;margin-bottom:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
.overall-row,.add-row{display:flex;gap:8px;margin-bottom:6px;}
.cat-budget-list{display:flex;flex-direction:column;gap:12px;}
.cat-budget-row{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--divider-soft);flex-wrap:wrap;}
.cat-budget-row:last-child{border-bottom:none;padding-bottom:0;}
.cat-budget-name{display:flex;align-items:center;gap:7px;font-size:13px;width:190px;flex-shrink:0;}
.cat-budget-bar{flex:1;min-width:160px;}
.muted-text{color:var(--muted);font-size:12px;}
.month-pick{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:16px;}
.export-row{display:flex;gap:10px;flex-wrap:wrap;}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.manage-list{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;}
.manage-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--divider-soft);font-size:13px;}
.manage-row:last-child{border-bottom:none;}
.confirm{display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb, var(--danger) 8%, transparent);border:1px solid var(--danger);padding:12px 14px;border-radius:9px;font-size:13px;width:100%;}
.confirm > div{display:flex;gap:8px;justify-content:flex-end;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);}
svg.chart text{fill:var(--muted);font-family:'Inter',sans-serif;}
@media (max-width:880px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:10px 14px;overflow-x:auto;}
  .brand{padding:0 10px 0 0;}
  .navlist{flex-direction:row;}
  .navitem span.lbl{display:none;}
  .sidebar-foot{display:none;}
  .content{padding:8px 14px 110px;}
  .topbar{flex-direction:column;align-items:flex-start;gap:10px;padding:16px 14px 10px;}
  .cards-row,.grid-2,.settings-grid,.form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin">⏳</div><span>Opening your ledger…</span></div></div>

<script>
/* ============================= CONSTANTS ============================= */
const STORAGE_KEY = "het-ledger-v1";

const DEFAULT_CATEGORIES = [
  { name: "Food & Groceries", color: "#1F5C4C" },
  { name: "Rent/Housing", color: "#16413D" },
  { name: "Utilities", color: "#5C7F9E" },
  { name: "Transportation/Fuel", color: "#4A6FA5" },
  { name: "Health & Medical", color: "#B8433A" },
  { name: "Entertainment & Leisure", color: "#8A5FA8" },
  { name: "Shopping & Personal Care", color: "#A85C7A" },
  { name: "Education", color: "#3D8B7A" },
  { name: "Subscriptions", color: "#C08A2E" },
  { name: "EMI/Loan Payments", color: "#7A5C8A" },
  { name: "Insurance", color: "#5C8A5C" },
  { name: "Travel", color: "#C4785C" },
  { name: "Gifts & Donations", color: "#9C8A4A" },
  { name: "Savings/Investments", color: "#5C9C8A" },
  { name: "Miscellaneous/Other", color: "#6B7268" },
];
const DEFAULT_PAYMENT_METHODS = ["Cash", "Debit Card", "Credit Card", "UPI/Wallet", "Bank Transfer", "Other"];
const DEFAULT_QUICK_ADDS = [
  { label: "Coffee", amount: 150, category: "Food & Groceries", paymentMethod: "UPI/Wallet" },
  { label: "Auto/Cab", amount: 120, category: "Transportation/Fuel", paymentMethod: "UPI/Wallet" },
  { label: "Groceries top-up", amount: 500, category: "Food & Groceries", paymentMethod: "Debit Card" },
];

function defaultData() {
  return {
    expenses: [], income: [],
    categories: DEFAULT_CATEGORIES.map(c => ({ ...c })),
    paymentMethods: [...DEFAULT_PAYMENT_METHODS],
    budgets: {}, overallBudget: 0,
    savingsGoal: { amount: 0, month: monthKey(new Date()) },
    quickAdds: DEFAULT_QUICK_ADDS.map(q => ({ ...q })),
    settings: { currency: "₹", weekStart: "Monday", theme: "light" },
  };
}

/* ============================= HELPERS ============================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`; }
function monthLabel(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleString("en-US",{month:"long",year:"numeric"}); }
function shortMonthLabel(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleString("en-US",{month:"short"}); }
function addMonths(key,n){ const [y,m]=key.split("-").map(Number); return monthKey(new Date(y,m-1+n,1)); }
function fmtDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtDateShort(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{day:"2-digit",month:"short"}); }
function fmtWeekday(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{weekday:"short"}); }
function daysInMonth(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m,0).getDate(); }
function isSameMonth(iso,key){ return iso.slice(0,7)===key; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function isoOf(d){ return new Date(d).toISOString().slice(0,10); }
function startOfWeek(dateObj, weekStart){
  const d = new Date(dateObj); const day = d.getDay();
  const target = weekStart === "Sunday" ? 0 : 1;
  let diff = day - target; if (diff < 0) diff += 7;
  d.setDate(d.getDate() - diff); d.setHours(0,0,0,0); return d;
}
function fmtMoney(currency, n){
  const neg = n < 0; const v = Math.abs(n||0);
  const s = v.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${neg?"−":""}${currency}${s}`;
}
function catColor(categories, name){ const c = categories.find(c=>c.name===name); return c?c.color:"#6B7268"; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function toCSV(rows, headers){
  const e = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [headers.map(e).join(",")];
  rows.forEach(r => lines.push(headers.map(h=>e(r[h])).join(",")));
  return lines.join("\n");
}
function downloadFile(filename, content, mime="text/csv"){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ============================= STORAGE ============================= */
function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const d = defaultData();
      return { ...d, ...parsed, settings: { ...d.settings, ...(parsed.settings||{}) } };
    }
  } catch(e){ console.error(e); }
  return defaultData();
}
function saveDB(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ showToast("Couldn't save — storage may be full", true); }
}

/* ============================= SVG CHARTS ============================= */
function donutSVG(segments, size=200, thickness=28){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size - thickness)/2, cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  let offset = 0, circles = "";
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(seg.name)}</title></circle>`;
    offset += dash;
  });
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="100%" height="200">${circles}</svg>`;
}
function lineSVG(points, currency, width=560, height=200){
  const max = Math.max(...points.map(p=>p.total), 1);
  const pad = {top:12,right:10,bottom:22,left:10};
  const w = width - pad.left - pad.right, h = height - pad.top - pad.bottom;
  const stepX = w/((points.length-1)||1);
  const coords = points.map((p,i)=>[pad.left+i*stepX, pad.top + h - (p.total/max)*h]);
  const path = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const dots = coords.map((c,i)=> i%5===0 || i===coords.length-1 ? `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--primary)"><title>${esc(points[i].label)}: ${esc(fmtMoney(currency,points[i].total))}</title></circle>` : "").join("");
  const gridY = [0,0.5,1].map(f => pad.top + h*f);
  const grid = gridY.map(y => `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="var(--divider)" stroke-dasharray="3 5"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${grid}<path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2"/>${dots}</svg>`;
}
function barSVG(bars, currency, width=560, height=200){
  const max = Math.max(...bars.map(b=>b.total), 1);
  const pad = {top:12,right:10,bottom:24,left:10};
  const w = width-pad.left-pad.right, h = height-pad.top-pad.bottom;
  const bw = (w/bars.length) * 0.55;
  const gap = (w/bars.length);
  const rects = bars.map((b,i)=>{
    const bh = max>0 ? (b.total/max)*h : 0;
    const x = pad.left + i*gap + (gap-bw)/2;
    const y = pad.top + h - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="var(--primary)"><title>${esc(b.label)}: ${esc(fmtMoney(currency,b.total))}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${height-6}" font-size="10" text-anchor="middle">${esc(b.label)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${rects}</svg>`;
}

/* ============================= COMPUTE ============================= */
function computeStats(db){
  const { expenses, income, settings } = db;
  const today = todayISO();
  const nowMonth = monthKey(new Date());
  const wkStart = isoOf(startOfWeek(new Date(), settings.weekStart));

  const todayTotal = expenses.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
  const weekTotal = expenses.filter(e=>e.date>=wkStart && e.date<=today).reduce((s,e)=>s+e.amount,0);
  const monthExpenses = expenses.filter(e=>isSameMonth(e.date, nowMonth));
  const monthTotal = monthExpenses.reduce((s,e)=>s+e.amount,0);
  const monthIncome = income.filter(i=>isSameMonth(i.date, nowMonth)).reduce((s,i)=>s+i.amount,0);
  const balance = monthIncome - monthTotal;
  const prevMonth = addMonths(nowMonth, -1);
  const prevMonthTotal = expenses.filter(e=>isSameMonth(e.date, prevMonth)).reduce((s,e)=>s+e.amount,0);

  const catMap = {};
  monthExpenses.forEach(e=>{ catMap[e.category] = (catMap[e.category]||0) + e.amount; });
  const categoryBreakdown = Object.entries(catMap).map(([name,value])=>({name,value,color:catColor(db.categories,name)})).sort((a,b)=>b.value-a.value);
  const top5 = categoryBreakdown.slice(0,5);

  const trend = [];
  for (let i=29;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = isoOf(d);
    const total = expenses.filter(e=>e.date===iso).reduce((s,e)=>s+e.amount,0);
    trend.push({date:iso,label:fmtDateShort(iso),total});
  }
  const mom = [];
  for (let i=3;i>=0;i--){
    const key = addMonths(nowMonth,-i);
    const total = expenses.filter(e=>isSameMonth(e.date,key)).reduce((s,e)=>s+e.amount,0);
    mom.push({key,label:shortMonthLabel(key),total});
  }

  const recurring = expenses.filter(e=>e.recurring);
  const seen = new Set(); const recurringUnique = [];
  recurring.forEach(e=>{ const k=e.category+"|"+e.note+"|"+e.frequency; if(!seen.has(k)){seen.add(k);recurringUnique.push(e);} });

  const budgetRows = Object.entries(db.budgets||{}).filter(([,amt])=>amt>0).map(([cat,amt])=>{
    const spent = catMap[cat]||0;
    const pct = amt>0 ? clamp((spent/amt)*100,0,999) : 0;
    return {category:cat,budget:amt,spent,pct,color:catColor(db.categories,cat)};
  }).sort((a,b)=>b.pct-a.pct);

  const overallSpentPct = db.overallBudget>0 ? clamp((monthTotal/db.overallBudget)*100,0,999) : 0;
  const overCount = budgetRows.filter(b=>b.pct>=100).length;
  const underCount = budgetRows.filter(b=>b.pct<100).length;

  let streak = 0;
  if (db.overallBudget > 0){
    const dailyBudget = db.overallBudget / daysInMonth(nowMonth);
    for (let i=1;i<=60;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      const iso = isoOf(d);
      const total = expenses.filter(e=>e.date===iso).reduce((s,e)=>s+e.amount,0);
      if (total <= dailyBudget) streak++; else break;
    }
  }

  const recentTx = [...expenses].sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,8);

  return { today, nowMonth, todayTotal, weekTotal, monthTotal, monthIncome, balance, prevMonth, prevMonthTotal,
    categoryBreakdown, top5, trend, mom, recurringUnique, budgetRows, overallSpentPct, overCount, underCount, streak, recentTx };
}

    ${stub("Balance this month", fmtMoney(currency,c.balance), c.monthIncome>0?`Income ${fmtMoney(currency,c.monthIncome)}`:"No income logged", c.balance<0)}

  const streak = (DB.overallBudget>0 && c.streak>0) ? `<div class="streak">🔥 <strong>${c.streak}-day streak</strong> staying under your daily budget</div>` : "";

  const donut = c.categoryBreakdown.length===0 ? emptyState("No expenses logged this month yet.") :

  const recurringBody = c.recurringUnique.length===0 ? emptyState("No recurring expenses logged.") :
    `<div class="toplist">${c.recurringUnique.slice(0,6).map(e=>`<div class="toprow">↻ <span class="topname">${esc(e.note||e.category)}</span><span class="chip">${esc(e.frequency)}</span><span class="topval mono">${fmtMoney(currency,e.amount)}</span></div>`).join("")}</div>`;

  return `${cards}${streak}
    <div class="grid-2">

/* ============================= TRANSACTIONS ============================= */
function renderTransactions(){
  const currency = DB.settings.currency;
  const today = todayISO(), nowMonth = monthKey(new Date());
  const wkStart = isoOf(startOfWeek(new Date(), DB.settings.weekStart));
  const t = UI.tx;

  let base = DB.expenses;
  if (t.tab==="day") base = base.filter(e=>e.date===today);
  else if (t.tab==="week") base = base.filter(e=>e.date>=wkStart && e.date<=today);
  else if (t.tab==="month") base = base.filter(e=>isSameMonth(e.date,nowMonth));
  else if (t.tab==="range" && t.rangeStart && t.rangeEnd) base = base.filter(e=>e.date>=t.rangeStart && e.date<=t.rangeEnd);

  let filtered = base.filter(e=>{
    if (t.cat!=="all" && e.category!==t.cat) return false;
    if (t.pay!=="all" && e.paymentMethod!==t.pay) return false;
    if (t.search.trim()){
      const q = t.search.toLowerCase();
      const hay = `${e.note||""} ${e.category} ${e.subcategory||""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered = [...filtered].sort((a,b)=>{
    if (t.sort==="date-desc") return b.date.localeCompare(a.date) || b.createdAt-a.createdAt;
    if (t.sort==="date-asc") return a.date.localeCompare(b.date);
    if (t.sort==="amount-desc") return b.amount-a.amount;
    if (t.sort==="amount-asc") return a.amount-b.amount;
    if (t.sort==="category") return a.category.localeCompare(b.category);
    return 0;
  });
  const total = filtered.reduce((s,e)=>s+e.amount,0);

  const tabs = `<div class="tabs">${[["day","Day"],["week","Week"],["month","Month"],["range","Custom"],["all","All"]].map(([k,l])=>`<button class="tab ${t.tab===k?'active':''}" data-action="tx-tab" data-tab="${k}">${l}</button>`).join("")}</div>`;

  const rangeRow = t.tab==="range" ? `<div class="range-row">
    <input type="date" class="inp" style="width:auto" value="${t.rangeStart}" data-role="tx-range-start">
    <span>to</span>
    <input type="date" class="inp" style="width:auto" value="${t.rangeEnd}" data-role="tx-range-end">
  </div>` : "";

  const filters = `<div class="filters">
    <div class="search">🔍<input placeholder="Search notes, category…" value="${esc(t.search)}" data-role="tx-search"></div>
    <select class="select" data-role="tx-cat"><option value="all" ${t.cat==='all'?'selected':''}>All categories</option>${DB.categories.map(c=>`<option value="${esc(c.name)}" ${t.cat===c.name?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
    <select class="select" data-role="tx-pay"><option value="all" ${t.pay==='all'?'selected':''}>All payment methods</option>${DB.paymentMethods.map(p=>`<option value="${esc(p)}" ${t.pay===p?'selected':''}>${esc(p)}</option>`).join("")}</select>
    <select class="select" data-role="tx-sort">
      <option value="date-desc" ${t.sort==='date-desc'?'selected':''}>Newest first</option>
      <option value="date-asc" ${t.sort==='date-asc'?'selected':''}>Oldest first</option>
      <option value="amount-desc" ${t.sort==='amount-desc'?'selected':''}>Amount: high to low</option>
      <option value="amount-asc" ${t.sort==='amount-asc'?'selected':''}>Amount: low to high</option>
      <option value="category" ${t.sort==='category'?'selected':''}>Category</option>
    </select>
  </div>`;

  const totalRow = `<div class="tx-total"><span>${filtered.length} transaction${filtered.length!==1?'s':''}</span><strong class="mono">${fmtMoney(currency,total)}</strong></div>`;

  let listHTML;
  if (filtered.length===0) listHTML = emptyState("No transactions match these filters.");
  else if (t.tab==="week"){
    const days = {};
    filtered.forEach(e=>{ (days[e.date] ||= []).push(e); });
    const grouped = Object.entries(days).sort((a,b)=>b[0].localeCompare(a[0]));
    listHTML = `<div class="week-groups">${grouped.map(([date,items])=>`
      <div class="week-group">
        <div class="week-group-head"><span>${fmtWeekday(date)}, ${fmtDate(date)}</span><strong class="mono">${fmtMoney(currency, items.reduce((s,e)=>s+e.amount,0))}</strong></div>
        ${txTable(items, currency, false)}
      </div>`).join("")}</div>`;
  } else {
    listHTML = txTable(filtered, currency, false);
  }

  return `${tabs}${rangeRow}${filters}${totalRow}${listHTML}`;
}

        <div class="form-grid">
          <label class="field"><span class="field-label">Amount<em>*</em></span><input class="inp" type="number" min="0" step="0.01" value="${esc(f.amount)}" data-role="form-amount" autofocus></label>
          <label class="field"><span class="field-label">Date<em>*</em></span><input class="inp" type="date" max="${todayISO()}" value="${esc(f.date)}" data-role="form-date"></label>
          <label class="field"><span class="field-label">Source</span><input class="inp" placeholder="Salary, freelance, refund…" value="${esc(f.source)}" data-role="form-source"></label>
        </div>
        <label class="field"><span class="field-label">Note</span><input class="inp" value="${esc(f.note)}" data-role="form-note"></label>
        ${f.error?`<div class="error">⚠ ${esc(f.error)}</div>`:""}
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="save-income">✓ Save income</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============================= BUDGETS ============================= */
function renderBudgets(){
  const c = computeStats(DB);
  const currency = DB.settings.currency;
  const overallBody = `<div class="overall-row">
      <input class="inp" type="number" placeholder="e.g. 30000" value="${DB.overallBudget||""}" data-role="overall-budget">
      <button class="btn btn-primary" data-action="save-overall-budget">Save</button>
    </div>
    ${DB.overallBudget>0 ? budgetBarHTML("This month", c.overallSpentPct, `${fmtMoney(currency,c.monthTotal)} of ${fmtMoney(currency,DB.overallBudget)}`) : ""}`;

  const catRows = DB.categories.map(cat=>{
    const spent = c.categoryBreakdown.find(b=>b.name===cat.name)?.value || 0;
    const budget = DB.budgets[cat.name] || 0;
    const pct = budget>0 ? clamp((spent/budget)*100,0,999) : 0;
    return `<div class="cat-budget-row">
      <div class="cat-budget-name"><span class="dot" style="background:${cat.color}"></span>${esc(cat.name)}</div>
      <input class="inp inp-sm" type="number" placeholder="No budget" value="${budget||""}" data-role="cat-budget" data-cat="${esc(cat.name)}">
      <div class="cat-budget-bar">${budget>0 ? budgetBarHTML("", pct, `${fmtMoney(currency,spent)} of ${fmtMoney(currency,budget)}`) : `<span class="muted-text">Spent ${fmtMoney(currency,spent)}</span>`}</div>
    </div>`;
  }).join("");

  return `${panel("Overall monthly budget","Optional — used for the streak indicator and overall progress", overallBody)}
    ${panel("Category budgets", monthLabel(c.nowMonth), `<div class="cat-budget-list">${catRows}</div>`)}`;
}

/* ============================= REPORTS ============================= */
function renderReports(){
  const currency = DB.settings.currency;
  const month = UI.reportMonth;
  const monthExpenses = DB.expenses.filter(e=>isSameMonth(e.date,month));
  const monthIncome = DB.income.filter(i=>isSameMonth(i.date,month));
  const totalSpent = monthExpenses.reduce((s,e)=>s+e.amount,0);
  const totalIncome = monthIncome.reduce((s,i)=>s+i.amount,0);
  const net = totalIncome - totalSpent;
  const catMap = {};
  monthExpenses.forEach(e=>{ catMap[e.category]=(catMap[e.category]||0)+e.amount; });
  const catSorted = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const biggestCategory = catSorted[0];
  const biggestExpense = [...monthExpenses].sort((a,b)=>b.amount-a.amount)[0];

  const year = month.slice(0,4);
  const yearlyByCat = {};
  DB.expenses.filter(e=>e.date.startsWith(year)).forEach(e=>{ yearlyByCat[e.category]=(yearlyByCat[e.category]||0)+e.amount; });
  const yearlyTotal = Object.values(yearlyByCat).reduce((s,v)=>s+v,0);
  const yearlySorted = Object.entries(yearlyByCat).sort((a,b)=>b[1]-a[1]);

  const monthPick = `<div class="month-pick">
    <button class="iconbtn" data-action="report-month" data-dir="-1">‹</button>
    <span>${monthLabel(month)}</span>
    <button class="iconbtn" data-action="report-month" data-dir="1" ${month>=monthKey(new Date())?'disabled':''}>›</button>
  </div>`;

  const cards = `<div class="cards-row">
    ${stub("Total spent", fmtMoney(currency,totalSpent))}
    ${stub("Total income", fmtMoney(currency,totalIncome))}
    ${stub("Net savings", fmtMoney(currency,net), "", net<0)}
    ${stub("Biggest category", biggestCategory?esc(biggestCategory[0]):"—", biggestCategory?fmtMoney(currency,biggestCategory[1]):"")}
  </div>`;

  const biggestBody = biggestExpense ? `<div class="toprow" style="padding:4px 0"><span class="dot" style="background:${catColor(DB.categories,biggestExpense.category)}"></span><span class="topname">${esc(biggestExpense.note||biggestExpense.category)} · ${fmtDate(biggestExpense.date)}</span><span class="topval mono">${fmtMoney(currency,biggestExpense.amount)}</span></div>` : emptyState("No expenses this month.");

  const exportBody = `<div class="export-row">
    <button class="btn btn-secondary" data-action="export-expenses">⬇ Export expenses (CSV)</button>
    <button class="btn btn-secondary" data-action="export-income">⬇ Export income (CSV)</button>
  </div>`;

  const yearlyBody = yearlySorted.length===0 ? emptyState("No data for this year yet.") :
    `<div class="toplist">${yearlySorted.map(([cat,val])=>`<div class="toprow"><span class="dot" style="background:${catColor(DB.categories,cat)}"></span><span class="topname">${esc(cat)}</span><span class="topval mono">${fmtMoney(currency,val)}</span></div>`).join("")}</div>`;

  return `${monthPick}${cards}
    ${panel("Biggest single expense", monthLabel(month), biggestBody)}
    ${panel("Export data","Download your ledger for records or taxes", exportBody)}
    ${panel(`Year in review — ${year}`, `Total: ${fmtMoney(currency,yearlyTotal)}`, yearlyBody)}`;
}

/* ============================= SETTINGS ============================= */
function renderSettings(){
  const currency = DB.settings.currency;
  const nowMonth = monthKey(new Date());
  const savedThisMonth = DB.income.filter(i=>isSameMonth(i.date,nowMonth)).reduce((s,i)=>s+i.amount,0) -
                          DB.expenses.filter(e=>isSameMonth(e.date,nowMonth)).reduce((s,e)=>s+e.amount,0);
  const goalPct = DB.savingsGoal?.amount>0 ? clamp((Math.max(savedThisMonth,0)/DB.savingsGoal.amount)*100,0,999) : 0;

  const prefsBody = `<div class="settings-grid">
    <label class="field"><span class="field-label">Currency symbol</span><input class="inp" maxlength="3" value="${esc(currency)}" data-role="setting-currency"></label>
    <label class="field"><span class="field-label">Week starts on</span><select class="select select-full" data-role="setting-weekstart">
      <option value="Monday" ${DB.settings.weekStart==='Monday'?'selected':''}>Monday</option>
      <option value="Sunday" ${DB.settings.weekStart==='Sunday'?'selected':''}>Sunday</option>
    </select></label>
    <label class="field"><span class="field-label">Appearance</span>
      <div class="segmented">
        <button type="button" class="${DB.settings.theme==='light'?'active':''}" data-action="set-theme" data-val="light">☀ Light</button>
        <button type="button" class="${DB.settings.theme==='dark'?'active':''}" data-action="set-theme" data-val="dark">☾ Dark</button>
      </div>
    </label>
  </div>`;

  const goalBody = `<div class="overall-row">
      <input class="inp" type="number" placeholder="e.g. 10000" id="goal-input" value="${DB.savingsGoal?.amount||""}">
      <button class="btn btn-primary" data-action="save-goal">Save</button>
    </div>
    ${DB.savingsGoal?.amount>0 ? budgetBarHTML("🎯 Saved this month", goalPct, `${fmtMoney(currency,Math.max(savedThisMonth,0))} of ${fmtMoney(currency,DB.savingsGoal.amount)}`) : ""}`;

  const catBody = `<div class="manage-list">${DB.categories.map((c,i)=>`
    <div class="manage-row"><span class="dot" style="background:${c.color}"></span>
      <input class="inp inp-inline" value="${esc(c.name)}" data-role="cat-rename" data-idx="${i}">
      <button class="iconbtn" data-action="delete-category" data-name="${esc(c.name)}">🗑</button>
    </div>`).join("")}</div>
    <div class="add-row"><input class="inp" id="new-cat-input" placeholder="New category name"><button class="btn btn-secondary" data-action="add-category">+ Add</button></div>`;

  const payBody = `<div class="manage-list">${DB.paymentMethods.map(p=>`
    <div class="manage-row"><span>${esc(p)}</span><button class="iconbtn" data-action="delete-payment" data-name="${esc(p)}">🗑</button></div>`).join("")}</div>
    <div class="add-row"><input class="inp" id="new-pay-input" placeholder="New payment method"><button class="btn btn-secondary" data-action="add-payment">+ Add</button></div>`;

  const incomeBody = DB.income.length===0 ? emptyState("No income logged yet.") :
    `<div class="manage-list">${DB.income.slice(0,12).map(inc=>`
      <div class="manage-row"><span>${fmtDate(inc.date)} · ${esc(inc.source)}</span><span class="topval mono" style="margin-left:auto">${fmtMoney(currency,inc.amount)}</span>
        <button class="iconbtn" data-action="edit-income" data-id="${inc.id}">✎</button>
        <button class="iconbtn" data-action="delete-income" data-id="${inc.id}">🗑</button>
      </div>`).join("")}</div>`;

  const dataBody = UI.confirmClear ? `<div class="confirm">
      <span>This permanently deletes every expense, income entry, and setting. Are you sure?</span>
      <div><button class="btn btn-ghost" data-action="cancel-clear">Cancel</button><button class="btn btn-danger" data-action="confirm-clear">Yes, delete everything</button></div>
    </div>` : `<button class="btn btn-danger" data-action="request-clear">Clear all data</button>`;

  return `${panel("Preferences","",prefsBody)}
    ${panel("Savings goal","Track progress toward a monthly savings target", goalBody)}
    ${panel("Categories","Add, rename, or remove spending categories", catBody)}
    ${panel("Payment methods","", payBody)}
    ${panel("Income entries","Edit or remove logged income", incomeBody)}
    ${panel("Data","", dataBody)}`;
}

/* ============================= FOCUS-PRESERVING RE-RENDER ============================= */
function rerenderPreserveFocus(){
  const active = document.activeElement;
  const tag = active && active.tagName;
  const isField = tag === "INPUT" || tag === "TEXTAREA";
  const role = isField ? active.dataset.role : null;
  const idAttr = isField ? active.id : null;
  const selStart = isField && active.setSelectionRange ? active.selectionStart : null;
  const selEnd = isField && active.setSelectionRange ? active.selectionEnd : null;
  const dataCat = isField ? active.dataset.cat : null;
  const dataIdx = isField ? active.dataset.idx : null;
  render();
  let el = null;
  if (role){
    const sel = `[data-role="${role}"]` + (dataCat?`[data-cat="${CSS.escape(dataCat)}"]`:"") + (dataIdx!=null?`[data-idx="${dataIdx}"]`:"");
    el = document.querySelector(sel);
  } else if (idAttr){
    el = document.getElementById(idAttr);
  }
  if (el){
    el.focus();
    if (selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
}

/* ============================= EVENT HANDLING ============================= */
function getForm(role, def){ return { role, def }; }

document.addEventListener("input", (e)=>{
  const el = e.target; const role = el.dataset.role;
  if (!role) return;
  const val = el.type === "checkbox" ? el.checked : el.value;

  if (role.startsWith("form-")){
    const key = role.replace("form-","");
    UI.form[key] = val;
    if (role === "form-recurring"){ rerenderPreserveFocus(); }
    return; // don't rerender on every keystroke for text fields (value already reflects typing)
  }
  if (role === "tx-search"){ UI.tx.search = val; rerenderPreserveFocus(); return; }
  if (role === "tx-range-start"){ UI.tx.rangeStart = val; rerenderPreserveFocus(); return; }
  if (role === "tx-range-end"){ UI.tx.rangeEnd = val; rerenderPreserveFocus(); return; }
  if (role === "overall-budget" || role === "cat-budget" || role === "setting-currency" || role === "cat-rename"){
    return; // read on blur/save instead of re-rendering every keystroke
  }
});

document.addEventListener("change", (e)=>{
  const el = e.target; const role = el.dataset.role;
  if (!role) return;
  if (role.startsWith("form-")){ UI.form[role.replace("form-","")] = el.value; return; }
  if (role === "tx-cat"){ UI.tx.cat = el.value; render(); return; }
  if (role === "tx-pay"){ UI.tx.pay = el.value; render(); return; }
  if (role === "tx-sort"){ UI.tx.sort = el.value; render(); return; }
  if (role === "setting-weekstart"){ DB.settings.weekStart = el.value; saveDB(); render(); return; }
});

document.addEventListener("blur", (e)=>{
  const el = e.target; if (!el.dataset) return;
  const role = el.dataset.role;
  if (role === "overall-budget"){ /* handled by explicit save button, but also save on blur */ }
  if (role === "cat-budget"){
    const cat = el.dataset.cat; const n = parseFloat(el.value);
    DB.budgets[cat] = isNaN(n) ? 0 : n;
    saveDB(); render();
  }
  if (role === "setting-currency"){
    const v = el.value.trim(); if (v){ DB.settings.currency = v; saveDB(); render(); }
  }
  if (role === "cat-rename"){
    const idx = parseInt(el.dataset.idx,10);
    const oldName = DB.categories[idx]?.name;
    const newName = el.value.trim();
    if (oldName && newName && newName !== oldName && !DB.categories.some((c,i)=>i!==idx && c.name.toLowerCase()===newName.toLowerCase())){
      DB.categories[idx].name = newName;
      DB.expenses.forEach(x=>{ if (x.category===oldName) x.category = newName; });
      if (DB.budgets[oldName]!=null){ DB.budgets[newName] = DB.budgets[oldName]; delete DB.budgets[oldName]; }
      saveDB();
    }
    render();
  }
}, true);

document.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case "nav": UI.view = btn.dataset.view; render(); break;
    case "overlay-close":
      if (e.target === btn) closeModal();
      break;
    case "close-modal": closeModal(); break;
    case "open-expense": openExpenseModal(null); break;
    case "edit-expense": openExpenseModal(DB.expenses.find(x=>x.id===btn.dataset.id)); break;
    case "delete-expense": DB.expenses = DB.expenses.filter(x=>x.id!==btn.dataset.id); saveDB(); showToast("Expense deleted"); break;
    case "duplicate-expense": {
      const src = DB.expenses.find(x=>x.id===btn.dataset.id);
      if (src) { DB.expenses = [{...src, id: uid(), date: todayISO(), createdAt: Date.now()}, ...DB.expenses]; saveDB(); showToast("Duplicated to today"); }
      break;
    }
    case "open-income": openIncomeModal(null); break;
    case "edit-income": openIncomeModal(DB.income.find(x=>x.id===btn.dataset.id)); break;
    case "delete-income": DB.income = DB.income.filter(x=>x.id!==btn.dataset.id); saveDB(); showToast("Income deleted"); break;
    case "apply-quickadd": {
      const qa = DB.quickAdds[parseInt(btn.dataset.idx,10)];
      if (qa){ UI.form = {...UI.form, amount: qa.amount, category: qa.category, note: qa.label, paymentMethod: qa.paymentMethod||UI.form.paymentMethod}; render(); }
      break;
    }
    case "set-essential": UI.form.essential = btn.dataset.val; render(); break;
    case "save-expense": submitExpense(); break;
    case "save-income": submitIncome(); break;
    case "tx-tab": UI.tx.tab = btn.dataset.tab; render(); break;
    case "save-overall-budget": {
      const input = document.querySelector('[data-role="overall-budget"]');
      DB.overallBudget = parseFloat(input.value) || 0; saveDB(); render();
      break;
    }
    case "report-month": UI.reportMonth = addMonths(UI.reportMonth, parseInt(btn.dataset.dir,10)); render(); break;
    case "export-expenses": {
      const csv = toCSV(DB.expenses.map(e=>({...e, amount:e.amount.toFixed(2)})), ["date","amount","category","subcategory","paymentMethod","note","recurring","frequency","essential"]);
      downloadFile(`expenses-${todayISO()}.csv`, csv);
      break;
    }
    case "export-income": {
      const csv = toCSV(DB.income.map(i=>({...i, amount:i.amount.toFixed(2)})), ["date","amount","source","note"]);
      downloadFile(`income-${todayISO()}.csv`, csv);
      break;
    }
    case "set-theme": DB.settings.theme = btn.dataset.val; saveDB(); render(); break;
    case "save-goal": {
      const input = document.getElementById("goal-input");
      DB.savingsGoal = { amount: parseFloat(input.value) || 0, month: monthKey(new Date()) };
      saveDB(); showToast("Savings goal saved");
      break;
    }
    case "delete-category": DB.categories = DB.categories.filter(c=>c.name!==btn.dataset.name); saveDB(); render(); break;
    case "add-category": {
      const input = document.getElementById("new-cat-input");
      const name = input.value.trim();
      if (name && !DB.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
        const palette = ["#1F5C4C","#C08A2E","#5C7F9E","#B8433A","#8A5FA8","#5C8A5C","#C4785C","#4A6FA5","#9C8A4A","#7A5C8A"];
        DB.categories.push({ name, color: palette[DB.categories.length % palette.length] });
        saveDB();
      }
      render();
      break;
    }
    case "delete-payment": DB.paymentMethods = DB.paymentMethods.filter(p=>p!==btn.dataset.name); saveDB(); render(); break;
    case "add-payment": {
      const input = document.getElementById("new-pay-input");
      const name = input.value.trim();
      if (name && !DB.paymentMethods.includes(name)){ DB.paymentMethods.push(name); saveDB(); }
      render();
      break;
    }
    case "request-clear": UI.confirmClear = true; render(); break;
    case "cancel-clear": UI.confirmClear = false; render(); break;
    case "confirm-clear": {
      DB = defaultData(); saveDB(); UI.confirmClear = false;
      showToast("All data cleared");
      break;
    }
  }
});

document.addEventListener("keydown", (e)=>{
  if (e.key === "Enter" && e.target.id === "new-cat-input") document.querySelector('[data-action="add-category"]').click();
  if (e.key === "Enter" && e.target.id === "new-pay-input") document.querySelector('[data-action="add-payment"]').click();
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.role === "overall-budget") document.querySelector('[data-action="save-overall-budget"]').click();
  if (e.key === "Enter" && e.target.id === "goal-input") document.querySelector('[data-action="save-goal"]').click();
});

function openExpenseModal(existing){
  UI.modal = "expense";
  UI.editId = existing ? existing.id : null;
  UI.form = existing ? { ...existing, amount: String(existing.amount), error:"" } : newExpenseForm();
  render();
}
function openIncomeModal(existing){
  UI.modal = "income";
  UI.editId = existing ? existing.id : null;
  UI.form = existing ? { ...existing, amount: String(existing.amount), error:"" } : newIncomeForm();
  render();
}
function closeModal(){ UI.modal = null; UI.editId = null; UI.form = {}; render(); }

function submitExpense(){
  const f = UI.form;
  const amt = parseFloat(f.amount);
  if (!f.date){ f.error = "Date is required."; render(); return; }
  if (!f.category){ f.error = "Category is required."; render(); return; }
  if (!amt || amt<=0){ f.error = "Amount must be a positive number."; render(); return; }
  const record = { date:f.date, amount:amt, category:f.category, subcategory:f.subcategory||"", paymentMethod:f.paymentMethod,
    note:f.note||"", recurring: !!f.recurring, frequency:f.frequency||"monthly", essential:f.essential||"" };
  if (UI.editId){
    DB.expenses = DB.expenses.map(x=> x.id===UI.editId ? {...x, ...record} : x);
    showToast("Expense updated");
  } else {
    DB.expenses = [{...record, id: uid(), createdAt: Date.now()}, ...DB.expenses];
    showToast("Expense added");
  }
  saveDB();
  closeModal();
}
function submitIncome(){
  const f = UI.form;
  const amt = parseFloat(f.amount);
  if (!f.date){ f.error = "Date is required."; render(); return; }
  if (!amt || amt<=0){ f.error = "Amount must be a positive number."; render(); return; }
  const record = { date:f.date, amount:amt, source:f.source||"", note:f.note||"" };
  if (UI.editId){
    DB.income = DB.income.map(x=> x.id===UI.editId ? {...x, ...record} : x);
    showToast("Income updated");
  } else {
    DB.income = [{...record, id: uid(), createdAt: Date.now()}, ...DB.income];
    showToast("Income added");
  }
  saveDB();
  closeModal();
}

/* ============================= INIT ============================= */
DB = loadDB();
document.body.className = DB.settings.theme === "dark" ? "dark" : "";
render();
</script>
